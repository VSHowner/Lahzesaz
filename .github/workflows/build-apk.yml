name: Build APK (لحظه‌ساز)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    # ubuntu-22.04 عمداً انتخاب شده؛ روی 24.04 ابزارهای قدیمی‌تر p4a/NDK مشکل دارند
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (system Python for buildozer host)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export JAVA_HOME
        run: |
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH
          java -version

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            ccache \
            libltdl-dev

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-global-

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-local-

      - name: Install buildozer and Cython (pinned)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # نسخه‌ها پین شده‌اند تا build تکرارپذیر باشد:
          #  buildozer 1.5.0  -> اولین نسخه‌ای که رسماً پایتون 3.11 را ساپورت می‌کند
          #  Cython 0.29.36   -> p4a v2024.01.21 هنوز با Cython 3.x سازگار نیست
          python -m pip install buildozer==1.5.0 Cython==0.29.36 virtualenv
          buildozer --version

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lahzesaz-debug-apk
          path: bin/*.apk
          if-no-files-found: error
